# Fixed before the tests were run.
start: "1971-09-01"            # first month after the US closed the gold window (15 Aug 1971)
inflation_bands: [0.025, 0.04] # same bands as the stock-bond correlation project
horizons_years: [1, 5, 10, 20]
hypotheses:
  H1: "Gold beats US CPI inflation in most 10-year windows."
  H2: "Gold moves one-for-one with inflation (annual beta near 1)."
  H3: "Gold protects a portfolio when bought after a high-inflation year."
sources:
  monthly.csv: {url: "https://raw.githubusercontent.com/datasets/gold-prices/main/data/monthly.csv", licence: "ODC-PDDL-1.0", sha256: "f20720f3413b3dd114cd116951516f0fab577ff8c91e102a3a92549582ea9608"}
